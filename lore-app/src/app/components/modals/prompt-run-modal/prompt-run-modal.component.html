<div class="pr-overlay" *ngIf="isOpen && prompt" (click)="close()">
  <div class="pr-modal" (click)="$event.stopPropagation()">

    <!-- Header -->
    <div class="pr-hdr">
      <div class="pr-hdr-left">
        <span class="pr-hdr-icon">✦</span>
        <div>
          <div class="pr-hdr-title">{{ prompt.name }}</div>
          <div class="pr-hdr-cat">{{ prompt.category }}</div>
        </div>
      </div>
      <button class="pr-close" (click)="close()">
        <lore-icon name="close" [size]="12"></lore-icon>
      </button>
    </div>

    <div class="pr-body">
      <!-- Variable form -->
      <div class="pr-no-vars" *ngIf="variables.length === 0">
        No variables — this prompt runs as-is.
      </div>

      <div class="pr-field" *ngFor="let v of variables">
        <label class="pr-label">{{ v }}</label>
        <textarea
          *ngIf="isTextarea(v)"
          class="pr-textarea"
          [placeholder]="'Enter ' + v + '…'"
          [(ngModel)]="values[v]"
          rows="4">
        </textarea>
        <input
          *ngIf="!isTextarea(v)"
          class="pr-input"
          type="text"
          [placeholder]="'Enter ' + v + '…'"
          [(ngModel)]="values[v]"
        />
      </div>

      <!-- Actions -->
      <div class="pr-actions">
        <button
          class="btn-pr pr-send-btn"
          *ngIf="hasApiKey"
          [disabled]="!canSend || isRunning"
          (click)="onRunWithAi()">
          {{ isRunning ? '⏳ Running…' : '✦ Run with AI' }}
        </button>
        <button
          class="btn-gh pr-send-btn"
          *ngIf="!hasApiKey"
          [disabled]="!canSend"
          (click)="onSendToChat()">
          ↗ Send to Chat
        </button>
        <button class="btn-gh" (click)="onCopyPrompt()">Copy Prompt</button>
        <button class="btn-gh pr-sched-toggle" (click)="showSchedule = !showSchedule" [class.active]="showSchedule || schedFrequency" title="Schedule">
          <lore-icon name="pulse" [size]="13"></lore-icon>
        </button>
      </div>

      <!-- AI Preview -->
      <div class="pr-preview" *ngIf="showPreview">
        <div class="pr-preview-hdr">
          <span>AI Response</span>
          <span class="pr-preview-streaming" *ngIf="isRunning">● streaming</span>
        </div>
        <div class="pr-preview-error" *ngIf="aiError">{{ aiError }}</div>
        <div class="pr-preview-body" *ngIf="!aiError" [innerHTML]="aiResultHtml"></div>
        <div class="pr-preview-acts" *ngIf="!isRunning && aiResult && !aiError">
          <button class="btn-gh" (click)="onSendToChat()">↗ Send to Chat</button>
          <button class="btn-pr" (click)="onSaveAsNote()" *ngIf="!noteSaved">Save as Note</button>
          <span class="pr-saved-badge" *ngIf="noteSaved">✓ Saved</span>
        </div>
        <!-- Section picker for save -->
        <div class="pr-save-picker" *ngIf="showSavePicker">
          <select class="pr-input" [(ngModel)]="saveSectionId">
            <option value="">Choose section…</option>
            <option *ngFor="let s of sectionsForSave" [value]="s.id">{{ s.label }}</option>
          </select>
          <button class="btn-pr" [disabled]="!saveSectionId" (click)="onConfirmSave()">Save</button>
          <button class="btn-gh" (click)="showSavePicker = false">Cancel</button>
        </div>
      </div>

      <!-- Schedule config -->
      <div class="pr-schedule" *ngIf="showSchedule">
        <div class="pr-sched-hdr">
          <lore-icon name="pulse" [size]="12"></lore-icon>
          <span>Auto-run schedule</span>
          <button class="pr-sched-clear" *ngIf="schedFrequency" (click)="onClearSchedule()" title="Remove schedule">Remove</button>
        </div>
        <div class="pr-sched-row">
          <select class="pr-input pr-sched-sel" [(ngModel)]="schedFrequency">
            <option value="">Frequency…</option>
            <option value="daily">Daily</option>
            <option value="weekly">Weekly</option>
            <option value="monthly">Monthly</option>
          </select>
          <div class="pr-sched-time-wrap">
            <select class="pr-input pr-sched-hh" [(ngModel)]="schedHour">
              <option *ngFor="let h of hours" [value]="h">{{ h }}</option>
            </select>
            <span class="pr-sched-colon">:</span>
            <select class="pr-input pr-sched-mm" [(ngModel)]="schedMinute">
              <option *ngFor="let m of minutes" [value]="m">{{ m }}</option>
            </select>
          </div>
          <select class="pr-input pr-sched-sel" [(ngModel)]="schedSectionId">
            <option value="">Save to section…</option>
            <option *ngFor="let s of sections" [value]="s.id">{{ s.label }}</option>
          </select>
        </div>
        <div class="pr-sched-note">
          AI output will be saved as a new note each time the schedule fires (on app open if overdue).
        </div>
        <button class="btn-pr pr-sched-save" [disabled]="!canSaveSchedule" (click)="onSaveSchedule()">
          {{ schedSaved ? '✓ Saved' : 'Save Schedule' }}
        </button>
      </div>
    </div>

  </div>
</div>

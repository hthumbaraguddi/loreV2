<app-login *ngIf="!isLoggedIn" (tokenReady)="loadUserData()"></app-login>

<ng-container *ngIf="isLoggedIn && (state$ | async) as state">
  <div id="app" [class.sb-collapsed]="state.sidebarCollapsed">

    <!-- Sidebar -->
    <app-sidebar
      [state]="state"
      [displayName]="displayName"
      (notebookSelected)="onNotebookSelected()"
      (addShelf)="onAddShelf()"
      (addNotebook)="onAddNotebook($event)"
      (editShelf)="onEditShelf($event)"
      (editNotebook)="onEditNotebook($event)"
      (openSettings)="onOpenSettings()"
      (openTemplates)="onOpenTemplates()"
      (openTemplateBuilder)="onOpenTemplateBuilder()"
      (openImportTemplate)="onOpenImportTemplate()"
      (importShelf)="onImportShelf()"
      (importNotebook)="onImportNotebook()"
      (exportShelf)="onExportShelf($event)"
      (exportNotebook)="onExportNotebook($event)">
    </app-sidebar>

    <!-- Main area -->
    <div id="main">
      <app-topbar
        [activeShelfName]="getActiveShelfName(state)"
        [activeNotebookName]="getActiveNotebookName(state)"
        [activeNotebookIcon]="getActiveNotebookIcon(state)"
        [hasActiveNotebook]="!!state.activeNotebookId"
        [syncStatus]="syncStatus"
        [isLocalMode]="isLocalMode"
        (searchChanged)="onSearchChanged($event)"
        (addSection)="onAddSection()"
        (addNote)="onAddNote(null)"
        (openTemplates)="onOpenTemplates()"
        (saveNow)="onSaveNow()"
        (openChat)="onOpenChat()">
      </app-topbar>

      <app-content-area
        [notebook]="getActiveNotebook(state)"
        [searchQuery]="searchQuery"
        [colors]="sectionColors"
        (editNote)="onEditNote($event)"
        (deleteNote)="onDeleteNote($event, state)"
        (addNote)="onAddNote($event)"
        (editSection)="onEditSection($event)"
        (deleteSection)="onDeleteSection($event, state)"
        (searchCleared)="onSearchCleared()">
      </app-content-area>
    </div>

    <!-- Edit Panel -->
    <app-edit-panel
      [note]="editingNote"
      [sectionId]="editingNoteSection?.id ?? null"
      [notebookId]="getActiveNotebook(state)?.id ?? null"
      [isOpen]="isEditPanelOpen"
      (saved)="onNoteSaved($event, state)"
      (deleted)="onNoteDeleted(state)"
      (closed)="onEditPanelClosed()">
    </app-edit-panel>

    <!-- Settings Panel -->
    <app-settings-panel
      [isOpen]="isSettingsPanelOpen"
      [state]="state"
      [customTemplates]="getCustomTemplates()"
      [syncStatus]="syncStatus"
      (closed)="onSettingsClosed()"
      (themeChanged)="onThemeChanged($event)"
      (fontSizeChanged)="onFontSizeChanged($event)"
      (nameChanged)="onNameChanged($event)"
      (templateDeleted)="onTemplateDeleted($event)"
      (templateEdited)="onTemplateEdited($event)"
      (driveReconnected)="onDriveReconnected()"
      (logout)="onLogout()">
    </app-settings-panel>

    <!-- Chat Panel -->
    <app-chat-panel
      [isOpen]="isChatPanelOpen"
      [activeNotebookId]="state.activeNotebookId"
      (closed)="isChatPanelOpen = false">
    </app-chat-panel>

    <!-- Shelf Modal -->
    <div class="ov" [class.show]="showShelfModal" (click)="onShelfCancelled()">
      <div (click)="$event.stopPropagation()">
        <app-shelf-modal
          *ngIf="showShelfModal"
          [shelf]="editingShelf"
          (saved)="onShelfSaved($event)"
          (deleted)="onShelfDeleted()"
          (cancelled)="onShelfCancelled()">
        </app-shelf-modal>
      </div>
    </div>

    <!-- Notebook Modal -->
    <div class="ov" [class.show]="showNotebookModal" (click)="onNotebookCancelled()">
      <div (click)="$event.stopPropagation()">
        <app-notebook-modal
          *ngIf="showNotebookModal"
          [notebook]="editingNotebook"
          [shelves]="state.shelves"
          [defaultShelfId]="notebookTargetShelfId"
          (saved)="onNotebookSaved($event)"
          (deleted)="onNotebookDeleted()"
          (cancelled)="onNotebookCancelled()">
        </app-notebook-modal>
      </div>
    </div>

    <!-- Section Modal -->
    <div class="ov" [class.show]="showSectionModal" (click)="onSectionCancelled()">
      <div (click)="$event.stopPropagation()">
        <app-section-modal
          *ngIf="showSectionModal"
          [section]="editingSection"
          (saved)="onSectionSaved($event, state)"
          (deleted)="onSectionDeleted(state)"
          (cancelled)="onSectionCancelled()">
        </app-section-modal>
      </div>
    </div>

    <!-- Template Browser Modal -->
    <div class="ov" [class.show]="showTemplateBrowserModal" (click)="onTemplateBrowserCancelled()">
      <div (click)="$event.stopPropagation()">
        <app-template-browser-modal
          *ngIf="showTemplateBrowserModal"
          [templates]="getAllTemplates()"
          (selected)="onTemplateBrowserSelected($event)"
          (cancelled)="onTemplateBrowserCancelled()"
          (buildTemplate)="onBuildTemplate()"
          (importTemplate)="onOpenImportTemplate()">
        </app-template-browser-modal>
      </div>
    </div>

    <!-- Template Builder Modal -->
    <div class="ov" [class.show]="showTemplateBuilderModal" (click)="onTemplateBuilderCancelled()">
      <div (click)="$event.stopPropagation()">
        <app-template-builder-modal
          *ngIf="showTemplateBuilderModal"
          [template]="editingTemplate"
          (saved)="onTemplateBuilderSaved($event)"
          (cancelled)="onTemplateBuilderCancelled()">
        </app-template-builder-modal>
      </div>
    </div>

    <!-- Hidden file input for import -->
    <input
      #importFileInput
      type="file"
      accept=".json"
      style="display:none"
      (change)="onImportFileSelected($event)">

    <!-- Export format picker modal -->
    <div class="ov" [class.show]="showExportModal" (click)="onExportModalCancelled()">
      <div class="modal" (click)="$event.stopPropagation()">
        <div class="mod-hdr">
          <span class="mod-ttl">Export Format</span>
          <button class="btn-cls" (click)="onExportModalCancelled()">
            <lore-icon name="close" [size]="12"></lore-icon>
          </button>
        </div>
        <div class="mod-body" style="padding:16px;display:flex;flex-direction:column;gap:10px">
          <p style="font-size:13px;opacity:.7;margin:0 0 4px">Choose how to export <strong>{{ exportTarget?.shelf?.name || exportTarget?.notebook?.name }}</strong>:</p>
          <button class="sb-act" style="justify-content:flex-start;gap:10px;padding:12px 14px" (click)="onExportFormatSelected('json')">
            <span style="font-size:18px">📦</span>
            <div style="text-align:left">
              <div style="font-size:13px;font-weight:600">JSON (Lore format)</div>
              <div style="font-size:11px;opacity:.6">Re-importable into Lore. Preserves all data.</div>
            </div>
          </button>
          <button class="sb-act" style="justify-content:flex-start;gap:10px;padding:12px 14px" (click)="onExportFormatSelected('html')">
            <span style="font-size:18px">🌐</span>
            <div style="text-align:left">
              <div style="font-size:13px;font-weight:600">HTML (Readable)</div>
              <div style="font-size:11px;opacity:.6">Standalone file. Open in any browser, share with anyone.</div>
            </div>
          </button>
        </div>
      </div>
    </div>

    <!-- Shelf picker modal for notebook import -->
    <div class="ov" [class.show]="showShelfPickerModal" (click)="onShelfPickerCancelled()">
      <div class="modal" (click)="$event.stopPropagation()">
        <div class="mod-hdr">
          <span class="mod-ttl">Select Target Shelf</span>
          <button class="btn-cls" (click)="onShelfPickerCancelled()">
            <lore-icon name="close" [size]="12"></lore-icon>
          </button>
        </div>
        <div class="mod-body" style="padding:16px;display:flex;flex-direction:column;gap:8px">
          <p style="font-size:13px;opacity:.7;margin:0 0 8px">Choose which shelf to import the notebook into:</p>
          <button
            *ngFor="let shelf of shelfPickerShelves"
            class="sb-act"
            style="justify-content:flex-start;gap:8px;padding:10px 12px"
            (click)="onShelfPickerSelected(shelf.id)">
            <span>{{ shelf.icon }}</span>
            <span>{{ shelf.name }}</span>
          </button>
          <p *ngIf="shelfPickerShelves.length === 0" style="font-size:13px;opacity:.5">No shelves yet — create a shelf first.</p>
        </div>
      </div>
    </div>

  </div>
</ng-container>

<div class="ep" [class.open]="isOpen">
  <!-- Header -->
  <div class="ep-hd">
    <button class="btn-ep-close" (click)="onClose()">
      <lore-icon name="close" [size]="12"></lore-icon>
    </button>
    <span class="ep-title">{{ panelTitle }}</span>
  </div>

  <!-- Template picker chips -->
  <div class="tpl-chips">
    <div
      *ngFor="let tpl of templates"
      class="tpl-chip"
      [class.sel]="selectedTemplate?.id === tpl.id"
      (click)="onChipClick(tpl)"
    >
      <span class="tc-ico">
        <lore-icon [name]="templateIcon(tpl)" [size]="14"></lore-icon>
      </span>
      <span class="tc-nm">{{ tpl.name }}</span>
    </div>
  </div>

  <!-- Form body -->
  <div class="ep-form">
    <!-- Title field (hidden for rich template — title extracted from markdown) -->
    <div class="frow" *ngIf="selectedTemplate?.id !== 'rich'">
      <label class="flbl">Title</label>
      <input
        class="fin"
        id="f_title"
        [(ngModel)]="noteTitle"
        placeholder="Note title…"
      />
    </div>

    <!-- Template-specific fields -->
    <div [innerHTML]="formHtml"></div>

    <!-- Paste AI Response button (rich template only) -->
    <div *ngIf="selectedTemplate?.id === 'rich'" style="margin-top: 12px;">
      <button class="btn-paste-ai" (click)="openPasteModal()">
        <lore-icon name="copy" [size]="13"></lore-icon> Paste AI Response
      </button>
    </div>
  </div>

  <!-- Footer -->
  <div class="ep-ft">
    <button
      *ngIf="isEdit"
      class="btn-del"
      (click)="onDelete()"
    >
      <lore-icon name="trash" [size]="13"></lore-icon> Delete
    </button>
    <button class="btn-gh" (click)="onClose()">Cancel</button>
    <button class="btn-save btn-pr" (click)="onSave()">
      <lore-icon name="save" [size]="13"></lore-icon> Save
    </button>
  </div>
</div>

<app-paste-ai-response-modal
  [isOpen]="pasteModalOpen"
  [targetSection]="pasteTarget"
  (closed)="onPasteModalClosed()"
  (noteSaved)="onPasteNoteSaved()">
</app-paste-ai-response-modal>

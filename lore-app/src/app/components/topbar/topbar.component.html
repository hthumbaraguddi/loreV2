<div id="topbar">
  <!-- Breadcrumb -->
  <div class="tb-crumb">
    <span class="crumb-sh">{{ activeShelfName }}</span>
    <span class="crumb-sep" *ngIf="activeShelfName && activeNotebookName">›</span>
    <span class="crumb-nb">
      <span *ngIf="activeNotebookIcon">{{ activeNotebookIcon }}&nbsp;</span>{{ activeNotebookName || 'Select a notebook' }}
    </span>
  </div>

  <!-- Search (temporarily hidden) -->
  <!--
  <div class="sr-wrap">
    <span class="sr-ico">
      <lore-icon name="search" [size]="12"></lore-icon>
    </span>
    <input
      #searchInput
      class="sr-in"
      type="search"
      placeholder="Search notes…"
      autocomplete="off"
      autocorrect="off"
      autocapitalize="off"
      spellcheck="false"
      [value]="searchValue"
      (input)="onSearchInput($any($event.target).value)"
    />
    <button class="sr-clear" *ngIf="searchValue" (click)="clearSearch()" title="Clear search">
      <lore-icon name="close" [size]="10"></lore-icon>
    </button>
  </div>
  -->

  <!-- Action buttons (only when a notebook is active) -->
  <button class="btn-gh" *ngIf="hasActiveNotebook" (click)="onAddSection()">
    <lore-icon name="section" [size]="12"></lore-icon> Section
  </button>
  <button class="btn-pr" *ngIf="hasActiveNotebook" (click)="onAddNote()">
    <lore-icon name="note-plus" [size]="12"></lore-icon> Note
  </button>

  <!-- Templates icon button -->
  <button class="btn-tb-icon" (click)="onOpenTemplates()" title="Browse Templates">
    <lore-icon name="template" [size]="15"></lore-icon>
  </button>

  <!-- Prompt Library button -->
  <button class="btn-tb-icon btn-prompts" (click)="onOpenPrompts()" title="Prompt Library">
    <lore-icon name="prompt" [size]="15"></lore-icon>
  </button>

  <!-- Chat button -->
  <button class="btn-tb-icon btn-chat" (click)="onOpenChat()" title="Ask AI">
    <lore-icon name="ai-sparkle" [size]="15"></lore-icon>
  </button>

  <!-- Drive status chip (Google users only) -->
  <ng-container *ngIf="!isLocalMode">
    <button
      class="btn-drive-chip"
      [class.btn-drive-reload]="driveConnected"
      [class.btn-drive-connect]="!driveConnected"
      (click)="driveConnected ? onReloadFromDrive() : onConnectDrive()"
      [title]="driveConnected ? 'Reload notes from Google Drive' : 'Connect Google Drive to sync'"
    >
      <svg *ngIf="driveConnected" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="23 4 23 10 17 10"/>
        <path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/>
      </svg>
      <svg *ngIf="!driveConnected" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 9.81a19.79 19.79 0 01-3.07-8.63A2 2 0 012 .18h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L6.09 7.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 14.92z"/>
      </svg>
      <span class="drive-reload-lbl">{{ driveConnected ? 'Drive' : 'Connect Drive' }}</span>
    </button>
  </ng-container>

  <!-- Manual save to Drive -->
  <button
    class="btn-save-drive"
    [class.saving]="syncStatus === 'syncing'"
    [class.saved]="syncStatus === 'saved'"
    [class.error]="syncStatus === 'error'"
    [disabled]="syncStatus === 'syncing'"
    (click)="onSaveNow()"
    [title]="syncLabel"
  >
    <lore-icon class="save-icon" [name]="syncStatus === 'error' ? 'warning' : syncStatus === 'saved' ? 'check' : 'save'" [size]="14"></lore-icon>
    <span class="save-lbl">{{ syncLabel }}</span>
  </button>

  <!-- Logout button -->
  <button class="btn-tb-icon btn-logout" (click)="onLogout()" title="Sign out">
    <lore-icon name="logout" [size]="15"></lore-icon>
  </button>

  <!-- Settings button -->
  <button class="btn-tb-icon btn-settings" (click)="onOpenSettings()" title="Settings">
    <lore-icon name="settings" [size]="15"></lore-icon>
  </button>
</div>

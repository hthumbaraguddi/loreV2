<div class="pl-view" *ngIf="isOpen">

  <!-- Topbar -->
  <div class="pl-topbar">
    <button class="pl-back-btn" (click)="close()">
      <lore-icon name="arrow-left" [size]="14"></lore-icon>
      Back
    </button>
    <span class="pl-topbar-title">
      <lore-icon name="prompt" [size]="14"></lore-icon>
      Prompt Library
    </span>
    <div class="pl-topbar-right">
      <button class="btn-gh pl-import-btn" (click)="onImportClick()">
        <lore-icon name="import" [size]="13"></lore-icon> Import
      </button>
      <button class="btn-pr" (click)="onNewPrompt()">
        <lore-icon name="note-plus" [size]="13"></lore-icon> New Prompt
      </button>
    </div>
  </div>

  <!-- Search bar -->
  <div class="pl-search-bar">
    <lore-icon name="search" [size]="13" class="pl-search-ico"></lore-icon>
    <input
      class="pl-search"
      type="text"
      placeholder="Search prompts…"
      [(ngModel)]="searchQuery"
    />
  </div>

  <!-- Scrollable content -->
  <div class="pl-scroll">
    <div class="pl-content">

      <!-- New Prompt Form -->
      <div class="pl-new-form" *ngIf="showNewForm">
        <h3 class="pl-new-title">New Prompt</h3>
        <div class="pl-new-row">
          <div class="pl-pf">
            <label class="pl-pl">Name *</label>
            <input class="pl-pin" placeholder="e.g. Weekly Summary" [(ngModel)]="newName" />
          </div>
          <div class="pl-pf">
            <label class="pl-pl">Category</label>
            <input class="pl-pin" placeholder="e.g. Research" [(ngModel)]="newCategory" />
          </div>
        </div>
        <div class="pl-pf">
          <label class="pl-pl">Prompt body — use {{ '{' }}{{ '{' }}variable{{ '}' }}{{ '}' }} for dynamic fields *</label>
          <textarea
            class="pl-pta"
            [(ngModel)]="newBody"
            rows="6"
            placeholder="Write your prompt here…">
          </textarea>
        </div>
        <div class="pl-new-acts">
          <button class="btn-gh" (click)="onCancelNew()">Cancel</button>
          <button class="btn-pr" [disabled]="!newName.trim() || !newBody.trim()" (click)="onSaveNew()">Save Prompt</button>
        </div>
      </div>

      <!-- Empty state -->
      <div *ngIf="filtered.length === 0 && !showNewForm" class="pl-empty">
        <lore-icon name="prompt" [size]="32"></lore-icon>
        <p>No prompts found.</p>
      </div>

      <!-- Prompt categories -->
      <div *ngFor="let cat of categories" class="pl-category">
        <div class="pl-cat-label">{{ cat }}</div>

        <div class="pl-card" *ngFor="let p of promptsForCategory(cat)">
          <div class="pl-card-main">
            <div class="pl-card-info">
              <span class="pl-card-name">{{ p.name }}</span>
              <span class="pl-badge-builtin" *ngIf="p.isBuiltIn">Built-in</span>
            </div>
            <div class="pl-card-meta">
              Last run: {{ formatDate(p.lastRunAt) }}
              <span class="pl-hist-link" *ngIf="getRunCount(p.id) > 0" (click)="toggleHistory(p.id)">
                · {{ getRunCount(p.id) }} note{{ getRunCount(p.id) === 1 ? '' : 's' }}
              </span>
            </div>
          </div>
          <div class="pl-card-acts">
            <button class="pl-btn-run" (click)="onRun(p)">
              <lore-icon name="prompt" [size]="12"></lore-icon> Run
            </button>
            <button class="pl-btn-icon" (click)="onDuplicate(p)" title="Duplicate">
              <lore-icon name="layers" [size]="12"></lore-icon>
            </button>
            <button class="pl-btn-icon" (click)="onExport(p)" title="Export">
              <lore-icon name="export" [size]="12"></lore-icon>
            </button>
            <button
              class="pl-btn-icon pl-btn-del"
              [disabled]="p.isBuiltIn"
              [title]="p.isBuiltIn ? 'Built-in prompts cannot be deleted' : 'Delete'"
              (click)="onDelete(p)">
              <lore-icon name="close" [size]="11"></lore-icon>
            </button>
          </div>

          <!-- Run history -->
          <div class="pl-history" *ngIf="expandedHistoryId === p.id">
            <div class="pl-hist-row" *ngFor="let note of getRunHistory(p.id)">
              <span class="pl-hist-title">{{ note.title }}</span>
              <span class="pl-hist-date">{{ formatDate(note.createdAt) }}</span>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- Hidden import input -->
  <input #importInput type="file" accept=".json" style="display:none" (change)="onImportFile($event)" />
</div>

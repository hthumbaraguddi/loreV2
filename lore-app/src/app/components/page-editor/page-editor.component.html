<div class="pg-editor">

  <!-- Top bar -->
  <div class="pg-editor-topbar">
    <button class="pg-back-btn" (click)="onClose()">
      <lore-icon name="arrow-left" [size]="14"></lore-icon>
      Back
    </button>
    <div class="pg-editor-topbar-right">
      <span class="pg-dirty-dot" *ngIf="isDirty" title="Unsaved changes"></span>
      <button class="btn-gh" (click)="onDelete()">
        <lore-icon name="trash" [size]="12"></lore-icon> Delete
      </button>
      <button class="btn-pr" (click)="onSave()">
        <lore-icon name="save" [size]="13"></lore-icon> Save
      </button>
    </div>
  </div>

  <!-- Page content -->
  <div class="pg-editor-scroll">
    <div class="pg-editor-body" [class.pg-editor-body--wide]="selectedTemplateId === 'rich'">

      <!-- Decoration Banner -->
      <div class="pg-decoration-banner" *ngIf="pendingTemplateId && !showTemplatePicker">
        <span class="pg-dec-icon">{{ pendingTemplateIcon }}</span>
        <span class="pg-dec-msg">
          This note looks like a <strong>{{ pendingTemplateName }}</strong>. Apply its structure?
        </span>
        <div class="pg-dec-actions">
          <button class="btn-dec-apply" (click)="onBannerApply()">Apply {{ pendingTemplateName }}</button>
          <button class="btn-dec-dismiss" (click)="onBannerDismiss()">Keep as plain note</button>
        </div>
      </div>

      <!-- Icon + Title -->
      <div class="pg-editor-header">
        <input
          class="pg-icon-field"
          [(ngModel)]="icon"
          maxlength="4"
          (ngModelChange)="isDirty = true"
          title="Page icon (emoji)"
        >
        <textarea
          class="pg-title-field"
          [(ngModel)]="title"
          placeholder="Untitled"
          rows="1"
          (input)="onTitleInput($event)"
          (keydown.enter)="$event.preventDefault(); canvasRef.nativeElement.focus()"
        ></textarea>
      </div>

      <!-- Template Picker (shown for new empty notes) -->
      <div class="pg-template-picker" *ngIf="showTemplatePicker">
        <div class="pg-picker-label">Choose a template to get started</div>
        <div class="pg-picker-grid">
          <button
            *ngFor="let tpl of allTemplates"
            class="pg-picker-card"
            (click)="onPickerSelectTemplate(tpl.id)"
            [title]="tpl.name"
          >
            <span class="pg-picker-card-icon">
              <lore-icon *ngIf="getTemplateIconName(tpl.id)" [name]="getTemplateIconName(tpl.id)!" [size]="22"></lore-icon>
              <span *ngIf="!getTemplateIconName(tpl.id)">{{ tpl.icon }}</span>
            </span>
            <span class="pg-picker-card-name">{{ tpl.name }}</span>
          </button>
        </div>
        <button class="pg-picker-blank" (click)="onPickerDismiss()">Start blank</button>
      </div>

      <!-- Inline template form (non-page templates) -->
      <ng-container *ngIf="selectedTemplateId && selectedTemplateId !== 'page' && !showTemplatePicker">
        <div class="pg-template-form">
          <div class="frow">
            <label class="flbl">Title</label>
            <input class="fin" id="f_title" [(ngModel)]="title" placeholder="Note title…" />
          </div>
          <div [innerHTML]="formHtml"></div>
          <div *ngIf="selectedTemplateId === 'rich'" class="pg-paste-ai-row">
            <button class="btn-paste-ai" (click)="openPasteModal()">
              <lore-icon name="ai-sparkle" [size]="13"></lore-icon> Paste AI Response
            </button>
          </div>
        </div>
      </ng-container>

      <!-- Canvas editor (page template) -->
      <ng-container *ngIf="(!selectedTemplateId || selectedTemplateId === 'page') && !showTemplatePicker">
        <div class="pg-canvas-wrapper">
          <div
            #editorCanvas
            class="pg-canvas"
            contenteditable="true"
            data-placeholder="Write something… (/ for commands)"
            (input)="onCanvasInput($event)"
            (keydown)="onCanvasKeydown($event)"
            (click)="onCanvasClick($event)"
          ></div>

          <!-- Slash menu -->
          <div
            class="pg-slash-menu"
            *ngIf="slashMenuVisible"
            [style.top.px]="slashMenuTop"
            [style.left.px]="slashMenuLeft"
          >
            <div
              class="pg-slash-item"
              *ngFor="let bt of blockTypes"
              (mousedown)="$event.preventDefault(); selectSlashType(bt.type)"
            >
              <span class="pg-slash-ico">{{ bt.icon }}</span>
              <span>{{ bt.label }}</span>
            </div>
          </div>
        </div>
      </ng-container>

      <!-- Tags -->
      <div class="pg-editor-tags" *ngIf="!showTemplatePicker">
        <span class="pg-tag" *ngFor="let tag of tags; let i = index">
          {{ tag }}
          <button class="pg-tag-rm" (click)="removeTag(i)">✕</button>
        </span>
        <input
          class="pg-tag-input"
          [(ngModel)]="tagInput"
          placeholder="Add tag…"
          (keydown)="onTagKeydown($event)"
        >
      </div>

    </div>
  </div>

  <!-- Undo toast -->
  <div class="pg-undo-toast" *ngIf="showUndoToast">
    <span>Applied {{ pendingTemplateName || 'template' }} — </span>
    <button class="pg-undo-btn" (click)="onUndoAutoApply()">Undo</button>
    <button class="pg-undo-close" (click)="showUndoToast = false">✕</button>
  </div>

  <!-- Paste AI Response modal -->
  <app-paste-ai-response-modal
    [isOpen]="pasteModalOpen"
    [targetSection]="pasteTarget"
    (closed)="onPasteModalClosed()"
    (noteSaved)="onPasteNoteSaved()">
  </app-paste-ai-response-modal>

</div>

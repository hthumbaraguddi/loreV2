<div class="ep" [class.open]="isOpen">
  <!-- Header -->
  <div class="ep-hd">
    <button class="btn-ep-close" (click)="onClose()">✕</button>
    <span class="ep-title">{{ panelTitle }}</span>
  </div>

  <!-- Template picker chips -->
  <div class="tpl-chips">
    <div
      *ngFor="let tpl of templates"
      class="tpl-chip"
      [class.sel]="selectedTemplate?.id === tpl.id"
      (click)="onChipClick(tpl)"
    >
      <span class="tc-ico">{{ tpl.icon }}</span>
      <span class="tc-nm">{{ tpl.name }}</span>
    </div>
  </div>

  <!-- Form body -->
  <div class="ep-form">
    <!-- Title field (always shown) -->
    <div class="frow">
      <label class="flbl">Title</label>
      <input
        class="fin"
        id="f_title"
        [(ngModel)]="noteTitle"
        placeholder="Note title…"
      />
    </div>

    <!-- Template-specific fields -->
    <div [innerHTML]="formHtml"></div>
  </div>

  <!-- Footer -->
  <div class="ep-ft">
    <button
      *ngIf="isEdit"
      class="btn-del"
      (click)="onDelete()"
    >Delete</button>
    <button class="btn-gh" (click)="onClose()">Cancel</button>
    <button class="btn-save btn-pr" (click)="onSave()">💾 Save</button>
  </div>
</div>

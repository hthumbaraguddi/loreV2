*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',-apple-system,sans-serif;background:var(--bg);color:var(--tp);min-height:100vh;transition:background .2s,color .2s}
.header{background:var(--sb);padding:16px 28px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:100;border-bottom:1px solid rgba(255,255,255,0.06)}
.hdr-logo{display:flex;align-items:center;gap:10px}
.hdr-logo svg{width:28px;height:28px}
.hdr-logo h1{font-size:16px;font-weight:600;color:#fff;letter-spacing:-.02em}
.hdr-sub{font-size:10px;color:rgba(255,255,255,.35);margin-top:1px}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn{padding:6px 12px;border-radius:7px;border:1px solid rgba(255,255,255,.12);background:transparent;color:rgba(255,255,255,.65);font-size:11.5px;font-family:"DM Sans",sans-serif;cursor:pointer;transition:all .15s}
.btn:hover{background:rgba(255,255,255,.08);color:#fff}
.btn-prim{background:var(--acc);border-color:var(--acc);color:#fff}
.btn-prim:hover{opacity:.88}
.count-badge{background:rgba(124,106,246,.3);color:#b8aefc;font-size:10px;padding:2px 8px;border-radius:5px;font-weight:600;font-family:"DM Mono",monospace}
.search-bar{background:var(--sb);padding:0 28px 12px;position:sticky;top:57px;z-index:99}
.search-wrap{position:relative;max-width:440px}
.search-wrap input{width:100%;padding:8px 12px 8px 34px;border-radius:7px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.07);color:#fff;font-size:12.5px;font-family:"DM Sans",sans-serif;outline:none;transition:border .15s}
.search-wrap input::placeholder{color:rgba(255,255,255,.3)}
.search-wrap input:focus{border-color:var(--acc)}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:14px;height:14px;stroke:rgba(255,255,255,.35);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.domain-tabs{background:var(--sb);padding:0 28px 14px;display:flex;gap:5px;flex-wrap:wrap;position:sticky;top:101px;z-index:98}
.domain-tab{padding:4px 11px;border-radius:6px;font-size:11px;font-weight:500;cursor:pointer;border:1px solid rgba(255,255,255,.1);background:transparent;color:rgba(255,255,255,.45);transition:all .15s;white-space:nowrap;font-family:"DM Sans",sans-serif}
.domain-tab:hover{color:rgba(255,255,255,.8);background:rgba(255,255,255,.06)}
.domain-tab.active{background:var(--acc);border-color:var(--acc);color:#fff}
.main{max-width:1280px;margin:0 auto;padding:28px 28px 80px}
.section{margin-bottom:44px}
.section-hdr{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.section-title{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--tt)}
.section-line{flex:1;height:1px;background:var(--border)}
.section-cnt{font-size:10px;color:var(--tt);opacity:.5;font-family:"DM Mono",monospace}
.icon-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:5px}
.icon-tile{display:flex;flex-direction:column;align-items:center;gap:7px;padding:12px 6px 10px;border-radius:9px;border:1px solid var(--border);background:var(--card);cursor:pointer;transition:all .15s;position:relative}
.icon-tile:hover{border-color:var(--acc);background:var(--acc-l);transform:translateY(-1px)}
.icon-tile:active{transform:scale(.95)}
.ico-wrap{width:32px;height:32px;display:flex;align-items:center;justify-content:center}
.ico-wrap svg{width:22px;height:22px;stroke:var(--tp);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;fill:none;transition:stroke .12s}
.icon-tile:hover .ico-wrap svg{stroke:var(--acc)}
.ico-name{font-size:9px;color:var(--ts);text-align:center;line-height:1.3;word-break:break-word}
.icon-tile.copied{border-color:#22C55E!important;background:#F0FDF4!important}
.icon-tile.copied .ico-wrap svg{stroke:#16A34A!important}
.icon-tile.copied .ico-name{color:#16A34A!important}
[data-dark] .icon-tile.copied{background:#052e16!important}
.icon-tile.app-icon .ico-wrap svg{width:28px;height:28px}
.no-results{text-align:center;padding:60px 20px;color:var(--tt);font-size:13px;display:none}
.no-results.show{display:block}
.stats-bar{display:flex;gap:28px;margin-bottom:24px;flex-wrap:wrap}
.stat-item{display:flex;flex-direction:column;gap:2px}
.stat-val{font-size:20px;font-weight:600;color:var(--tp);font-family:"DM Mono",monospace;letter-spacing:-.03em}
.stat-lbl{font-size:10px;color:var(--tt)}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--tp);color:var(--bg);padding:6px 14px;border-radius:7px;font-size:12px;font-weight:500;z-index:9999;transition:transform .25s;pointer-events:none;white-space:nowrap;font-family:"DM Mono",monospace}
#toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>

const DOMAIN_META = {
  app:        {label:'App Icons',    emoji:''},
  nav:        {label:'Navigation',   emoji:''},
  struct:     {label:'Structure',    emoji:''},
  actions:    {label:'Actions',      emoji:''},
  content:    {label:'Content & Meta',emoji:''},
  user:       {label:'User & Settings',emoji:''},
  status:     {label:'Status & Feedback',emoji:''},
  shipping:   {label:'Shipping & Logistics',emoji:'📦'},
  scrum:      {label:'Scrum / Agile',emoji:'🔄'},
  health:     {label:'Personal Health',emoji:'❤️'},
  investing:  {label:'Personal Investing',emoji:'📈'},
  equity:     {label:'Equity',        emoji:'🏦'},
  mutualfunds:{label:'Mutual Funds',  emoji:'💹'},
  banking:    {label:'Banking & Insurance',emoji:'🏛️'},
  lifesci:    {label:'Life Sciences', emoji:'🔬'},
  data:       {label:'Data & Analytics',emoji:'📊'},
  comms:      {label:'Communications',emoji:'💬'},
  ecommerce:  {label:'E-Commerce',    emoji:'🛒'},
  security:   {label:'Security',      emoji:'🔒'},
};

let activeDomain = 'all';
let searchTerm = '';

function buildSVG(icon) {
  if (icon.svg) {
    const sz = icon.appIcon ? 36 : 24;
    return `<svg width="${sz}" height="${sz}" viewBox="0 0 ${sz} ${sz}" fill="none" xmlns="http://www.w3.org/2000/svg">${icon.svg}</svg>`;
  }
  return `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">${icon.paths.join('')}</svg>`;
}

function getVisible() {
  return ICONS.filter(ic => {
    const domainOk = activeDomain === 'all' || ic.cat === activeDomain;
    const searchOk = !searchTerm || ic.name.toLowerCase().includes(searchTerm) || ic.id.toLowerCase().includes(searchTerm);
    return domainOk && searchOk;
  });
}

function render() {
  const visible = getVisible();
  document.getElementById('statVisible').textContent = visible.length;
  document.getElementById('iconCount').textContent = ICONS.length + ' icons';
  const container = document.getElementById('sectionsContainer');
  container.innerHTML = '';
  document.getElementById('noResults').classList.toggle('show', visible.length === 0);
  if (!visible.length) { document.getElementById('searchTerm').textContent = searchTerm; return; }

  const groups = {};
  visible.forEach(ic => {
    if (!groups[ic.cat]) groups[ic.cat] = [];
    groups[ic.cat].push(ic);
  });

  Object.entries(groups).forEach(([cat, icons]) => {
    const meta = DOMAIN_META[cat] || {label: cat, emoji: ''};
    const sec = document.createElement('div');
    sec.className = 'section';
    sec.innerHTML = `<div class="section-hdr">
      <span class="section-title">${meta.emoji ? meta.emoji + ' ' : ''}${meta.label}</span>
      <span class="section-line"></span>
      <span class="section-cnt">${icons.length}</span>
    </div><div class="icon-grid" id="grid-${cat}"></div>`;
    container.appendChild(sec);
    const grid = sec.querySelector('.icon-grid');
    icons.forEach(icon => {
      const tile = document.createElement('div');
      tile.className = 'icon-tile' + (icon.appIcon ? ' app-icon' : '');
      tile.title = icon.id;
      tile.innerHTML = `<div class="ico-wrap">${buildSVG(icon)}</div><div class="ico-name">${icon.name}</div>`;
      tile.addEventListener('click', () => copyIcon(tile, icon));
      grid.appendChild(tile);
    });
  });
}

let copyTm;
function copyIcon(tile, icon) {
  navigator.clipboard?.writeText(icon.id).catch(() => {});
  tile.classList.add('copied');
  const lbl = tile.querySelector('.ico-name');
  const prev = lbl.textContent;
  lbl.textContent = '✓ copied';
  clearTimeout(copyTm);
  copyTm = setTimeout(() => { tile.classList.remove('copied'); lbl.textContent = prev; }, 1600);
  showToast('Copied: ' + icon.id);
}

let toastTm;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTm);
  toastTm = setTimeout(() => t.classList.remove('show'), 2000);
}

function setDomain(d, btn) {
  activeDomain = d;
  document.querySelectorAll('.domain-tab').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  render();
}

function filterIcons() {
  searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
  render();
}

function toggleDark() {
  const on = document.documentElement.hasAttribute('data-dark');
  on ? document.documentElement.removeAttribute('data-dark') : document.documentElement.setAttribute('data-dark','');
  document.querySelector('.btn[onclick="toggleDark()"]').textContent = on ? '☾ Dark' : '☀ Light';
}

function downloadSprite() {
  const defs = `<defs><style>.icon{stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}</style>
  <linearGradient id="lore-grad-main" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#7C6AF6"/><stop offset="100%" stop-color="#4F3FCC"/></linearGradient>
  <linearGradient id="lore-grad-badge" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#A78BFA"/><stop offset="100%" stop-color="#6D5CE8"/></linearGradient>
</defs>`;
  const symbols = ICONS.map(ic => {
    const vb = ic.appIcon ? '0 0 36 36' : '0 0 24 24';
    const inner = ic.svg || ic.paths.join('');
    return `<symbol id="icon-${ic.id}" viewBox="${vb}">${inner}</symbol>`;
  }).join('\n  ');
  const sprite = `<?xml version="1.0" encoding="UTF-8"?>\n<!-- Lore Icon Sprite v2.0 — ${ICONS.length} icons -->\n<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" style="display:none">\n  ${defs}\n  ${symbols}\n</svg>`;
  const blob = new Blob([sprite], {type:'image/svg+xml'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'lore-icons.svg';
  a.click();
  showToast(`Downloaded ${ICONS.length} icons`);
}

render();
</script>

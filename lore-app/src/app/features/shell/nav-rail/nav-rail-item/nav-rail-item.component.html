<button
  class="nav-rail-item"
  [class.active]="active()"
  [attr.title]="item().label"
  [attr.aria-label]="item().label"
  [attr.aria-current]="active() ? 'page' : null"
  [attr.role]="item().route ? 'link' : 'button'"
  (click)="onClick()"
  (keydown)="onKeyDown($event)"
  tabindex="0"
>
  <span class="material-symbols-outlined">{{ item().icon }}</span>
  
  @if (showBadge()) {
    <span class="badge" [attr.aria-label]="item().badgeCount + ' notifications'">
      {{ badgeText() }}
    </span>
  }
</button>

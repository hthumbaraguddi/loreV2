<!-- Mobile backdrop — tap to close sidebar -->
<div class="sb-backdrop" [class.show]="isMobileOpen" (click)="closeMobileSidebar()"></div>

<!-- Toggle sidebar button (outside sidebar, fixed position) -->
<button class="btn-tsb" [class.closed]="state.sidebarCollapsed && !isMobileOpen" (click)="onToggleSidebar()" title="Toggle sidebar">
  <lore-icon [name]="isMobileOpen || (!isMobile && !state.sidebarCollapsed) ? 'chevron-left' : 'chevron-right'" [size]="10"></lore-icon>
</button>

<!-- Sidebar -->
<div id="sidebar" [class.collapsed]="state.sidebarCollapsed === true && !isMobileOpen" [class.mobile-open]="isMobileOpen">

  <!-- Workspace header -->
  <div class="ws-hdr">
    <div class="ws-av">{{ userInitial }}</div>
    <span class="ws-nm">My Workspace</span>
  </div>

  <!-- Quick actions -->
  <div class="sb-acts">
    <button class="sb-act" (click)="onImportShelf()">
      <lore-icon name="shelf" [size]="14" class="sai"></lore-icon><span>Import Shelf</span>
    </button>
    <button class="sb-act" (click)="onImportNotebook()">
      <lore-icon name="notebook" [size]="14" class="sai"></lore-icon><span>Import Notebook</span>
    </button>
  </div>

  <div class="sb-div"></div>

  <!-- Shelf / Notebook scroll area -->
  <div class="sb-scroll">

    <!-- Add shelf button -->
    <div class="shelf-hdr" (click)="onAddShelf()" style="margin-bottom:4px">
      <lore-icon name="plus" [size]="10" style="opacity:.6;margin-right:4px"></lore-icon>
      <span class="sh-nm" style="text-transform:none;letter-spacing:0;font-size:12px;opacity:.6">Add Shelf</span>
    </div>

    <!-- Shelves -->
    <div class="shelf-grp" *ngFor="let shelf of state?.shelves">
      <div class="shelf-hdr" (click)="onToggleShelf(shelf, $event)">
        <lore-icon class="sh-caret" [name]="shelf.open ? 'chevron-down' : 'chevron-right'" [size]="10"></lore-icon>
        <span class="sh-ico">
          <lore-icon *ngIf="isSvgIcon(shelf.icon)" [name]="shelf.icon" [size]="14"></lore-icon>
          <ng-container *ngIf="!isSvgIcon(shelf.icon)">{{ shelf.icon }}</ng-container>
        </span>
        <span class="sh-nm">{{ shelf.name }}</span>
        <button class="sh-add" title="Add notebook" (click)="onAddNotebook(shelf, $event)">
          <lore-icon name="plus" [size]="11"></lore-icon>
        </button>
        <button class="sh-add" title="Edit shelf" (click)="onEditShelf(shelf, $event)">
          <lore-icon name="edit" [size]="11"></lore-icon>
        </button>
        <button class="sh-add" title="Export shelf" (click)="onExportShelf(shelf, $event)">
          <lore-icon name="export" [size]="11"></lore-icon>
        </button>
      </div>

      <!-- Notebooks -->
      <div class="sh-books" [class.closed]="!shelf.open">
        <div
          class="nb-itm"
          *ngFor="let nb of getNotebooksForShelf(shelf.id)"
          [class.active]="isActiveNotebook(nb.id)"
          (click)="onSelectNotebook(nb)"
        >
          <span class="nb-itm-ico">
            <lore-icon *ngIf="isSvgIcon(nb.icon)" [name]="nb.icon" [size]="13"></lore-icon>
            <ng-container *ngIf="!isSvgIcon(nb.icon)">{{ nb.icon }}</ng-container>
          </span>
          <span class="nb-itm-nm">{{ nb.name }}</span>
          <span class="nb-itm-ct">{{ nb.sections.length }}</span>
          <span class="nb-itm-ed">
            <button class="btn-nbe" title="Edit notebook" (click)="onEditNotebook(nb, $event)">
              <lore-icon name="edit" [size]="11"></lore-icon>
            </button>
            <button class="btn-nbe" title="Export notebook" (click)="onExportNotebook(nb, $event)">
              <lore-icon name="export" [size]="11"></lore-icon>
            </button>
          </span>
        </div>
      </div>
    </div>

  </div>

  <!-- Footer -->
  <div class="sb-foot">
    <div class="usr-pill" (click)="onOpenSettings()">
      <div class="usr-av">{{ userInitial }}</div>
      <div class="usr-info">
        <div class="usr-nm">{{ resolvedDisplayName }}</div>
        <div class="usr-role">Free plan</div>
      </div>
      <button class="btn-cog" title="Settings">
        <lore-icon name="settings" [size]="14"></lore-icon>
      </button>
    </div>
  </div>

</div>

<div class="ov show">
  <div class="mod" [class.has-preview]="previewHtml !== null">

    <!-- Left: template list -->
    <div class="mod-left">
      <h2 class="mod-ttl">📋 Note Templates</h2>
      <p class="mod-desc">Pick a template to preview it, then click Use to apply.</p>

      <div class="tpl-grid">
        <div
          *ngFor="let tpl of templates"
          class="tpl-card"
          [class.selected]="selectedId === tpl.id"
          [style.border-color]="getColor(tpl.color).border"
          [style.background]="getColor(tpl.color).bg + '44'"
          (click)="onPreview(tpl)">
          <div class="tpl-icon">{{ tpl.icon }}</div>
          <div class="tpl-name" [style.color]="getColor(tpl.color).text">{{ tpl.name }}</div>
        </div>
      </div>

      <div class="tpl-browser-new">
        <span class="tpl-browser-new-lbl">Want something custom?</span>
        <div class="tpl-browser-new-acts">
          <button class="btn-sec" (click)="onImportTemplate()">📥 Import</button>
          <button class="btn-prim" (click)="onBuildTemplate()">🧩 Build Template</button>
        </div>
      </div>

      <div class="mod-act">
        <button class="btn-sec" (click)="cancel()">Close</button>
        <button class="btn-prim" *ngIf="selectedId" (click)="select(selectedId)">Use Template</button>
      </div>
    </div>

    <!-- Right: preview panel -->
    <div class="mod-preview" *ngIf="previewHtml !== null">
      <div class="prev-hdr">
        <span class="prev-ttl">Preview</span>
        <button class="prev-close" (click)="clearPreview()">✕</button>
      </div>
      <div class="prev-note-card">
        <div class="card-hdr" style="cursor:default">
          <span class="card-title">{{ previewTitle }}</span>
          <span class="card-tpl-pill">{{ previewIcon }} {{ previewName }}</span>
        </div>
        <div class="card-body open" [innerHTML]="previewHtml"></div>
      </div>
    </div>

  </div>
</div>

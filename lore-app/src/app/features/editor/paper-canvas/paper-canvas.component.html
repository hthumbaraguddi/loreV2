<div class="paper-canvas" role="document" aria-label="Note editor">
  <!-- Canvas background -->
  <lore-canvas-background [style]="backgroundStyle()" />

  <!-- Canvas content -->
  <div class="canvas-content">
    <!-- Note header -->
    <div class="note-header">
      <span class="material-symbols-outlined note-type-icon" [style.color]="noteTypeColor()">
        {{ noteTypeIcon() }}
      </span>
      <div class="note-meta">
        <h1 class="note-title">{{ fullNote().title }}</h1>
        <div class="note-details">
          <span class="note-date">{{ getRelativeTime(fullNote().updatedAt) }}</span>
          <span class="note-status" [class]="fullNote().status">{{ fullNote().status }}</span>
          @if (fullNote().tags?.length) {
            @for (tag of fullNote().tags; track tag) {
              <span class="tag">#{{ tag }}</span>
            }
          }
        </div>
      </div>
    </div>

    <!-- Block list -->
    <lore-block-list
      [blocks]="blocks()"
      [readOnly]="readOnly()"
      (blockAdded)="onBlockAdded($event)"
      (blockChanged)="onBlockChanged($event)"
      (blockDeleted)="onBlockDeleted($event)"
      (blockReordered)="onBlockReordered($event)"
      (duplicateRequested)="onDuplicateBlock($event)"
    />
  </div>
</div>

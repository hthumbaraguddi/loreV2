<lore-nav-rail 
  [items]="navItems" 
  (itemSelected)="onNavSelect($event)"
/>

<aside 
  class="sidebar-region"
  [class.collapsed]="!sidebarOpen()"
  [attr.aria-label]="'Sidebar navigation'"
  [attr.aria-hidden]="!sidebarOpen()"
>
  <lore-sidebar></lore-sidebar>
</aside>

<main class="editor-region">
  <router-outlet />
</main>

<aside 
  class="right-panel-region"
  [class.open]="rightPanelOpen()"
  [attr.aria-label]="'Right panel'"
  [attr.aria-hidden]="!rightPanelOpen()"
>
  @if (layoutService.activeRightPanel() === 'ai-chat') {
    <lore-ai-chat></lore-ai-chat>
  }
  @if (layoutService.activeRightPanel() === 'context-panel') {
    <lore-context-panel
      [note]="editorService.activeNoteObject()"
      (close)="onContextPanelClose()"
      (tagAdded)="onContextTagAdded($event)"
      (tagRemoved)="onContextTagRemoved($event)"
      (navigateToNote)="onNavigateToNote($event)"
    />
  }
</aside>

<!-- Global Search Overlay -->
@if (searchService.isOpen()) {
  <lore-global-search (close)="searchService.closeSearch()" />
}

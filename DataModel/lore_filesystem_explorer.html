# Integration Strategy — BTP Extension Approach

## Context

Contoso AG currently runs **ECC 6.0 EHP8** with custom Z-transactions 
across procurement and MRO. The target is a side-by-side BTP extension 
that exposes clean APIs to the new Fiori UI — avoiding core mods.

## Recommended Approach

After reviewing the existing BAPI layer with the SAP Basis team, the 
\`CAP (Cloud Application Programming model)\` approach is preferred over 
an OData-only extension for these reasons:

- CDS annotations allow semantic layer once, served everywhere
- Built-in multitenancy if Contoso needs SaaS pivot later  
- OData V4 + GraphQL projection from the same CAP service

## Key Integration Points

### 1. Procurement Flow
RFC → BAPI_PO_CREATE1 still needed for write-back. Wrap inside a 
CAP action with an event-driven saga pattern on BTP Event Mesh.

### 2. MRO / PM Module
Plant Maintenance orders will go through an iDoc bridge during 
cutover. Confirm with client if they want real-time or batch.

### 3. AI Angle
Opportunity flagged: predictive maintenance scoring using historical 
PM order data via SAP AI Core. Mention in next steering call.

## Follow-up Actions

- [ ] Get BAPI authorization list from Basis team by May 5
- [ ] Draft CAP service skeleton — share with client architect
- [ ] Review SLA for Event Mesh in client's BTP subaccount

function renderJSON(obj, indent=0) {
  const pad = '  '.repeat(indent);
  const pad1 = '  '.repeat(indent+1);
  if (Array.isArray(obj)) {
    if (obj.length === 0) return '<span>[]</span>';
    const items = obj.map(v => pad1 + renderVal(v, indent+1)).join(',\n');
    return `[\n${items}\n${pad}]`;
  }
  const entries = Object.entries(obj).map(([k,v]) =>
    `${pad1}<span class="token-key">"${k}"</span>: ${renderVal(v, indent+1)}`
  ).join(',\n');
  return `{\n${entries}\n${pad}}`;
}
function renderVal(v, indent) {
  if (v === null) return '<span class="token-null">null</span>';
  if (typeof v === 'boolean') return `<span class="token-bool">${v}</span>`;
  if (typeof v === 'number') return `<span class="token-num">${v}</span>`;
  if (typeof v === 'string') return `<span class="token-str">"${v}"</span>`;
  if (Array.isArray(v)) {
    if (v.length === 0) return '[]';
    const items = v.map(i => renderVal(i, indent)).join(', ');
    return `[${items}]`;
  }
  if (typeof v === 'object') return renderJSON(v, indent);
  return String(v);
}

function renderMD(text) {
  const escHtml = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return text.split('\n').map(line => {
    const e = escHtml(line);
    if (line.startsWith('---')) return `<span class="token-md-meta">${e}</span>`;
    if (line.startsWith('# ')) return `<span class="token-md-h1">${e}</span>`;
    if (line.startsWith('## ')) return `<span class="token-md-h2">${e}</span>`;
    if (line.startsWith('### ')) return `<span class="token-md-h3">${e}</span>`;
    if (/^(id|notebookId|templateId|title|tags|wordCount|isFavorite|isPinned|isArchived|createdAt|updatedAt):/.test(line))
      return `<span class="token-md-meta">${e}</span>`;
    if (line.startsWith('- [ ]') || line.startsWith('- [x]'))
      return `<span class="token-md-tag">${e}</span>`;
    if (line.startsWith('-'))
      return `<span class="token-md-body">${e}</span>`;
    const coded = e.replace(/`([^`]+)`/g, '<span class="token-md-code">$&</span>');
    const bolded = coded.replace(/\*\*([^*]+)\*\*/g, '<span class="token-md-bold">**$1**</span>');
    return `<span class="token-md-body">${bolded}</span>`;
  }).join('\n');
}

function buildTree(nodes, depth=0) {
  let html = '';
  nodes.forEach(n => {
    const isOpen = openNodes.has(n.id);
    const hasChildren = n.children && n.children.length;
    const isFile = !!n.file;
    const isActive = activeFile === n.file;
    const pl = 10 + depth * 14;
    const chevron = hasChildren
      ? `<span class="chevron ${isOpen?'open':''}">&#9656;</span>`
      : `<span class="chevron leaf">&#9656;</span>`;
    const badge = isFile && n.badge
      ? `<span class="file-badge badge-${n.badge}">${n.badge}</span>` : '';
    html += `<div class="tree-item ${isActive?'active':''}" style="padding-left:${pl}px" data-id="${n.id}" data-file="${n.file||''}">
      ${chevron}
      <span class="fi">${n.icon}</span>
      <span class="label">${n.label}<span class="ext">${n.ext||''}</span></span>
      ${badge}
    </div>`;
    if (hasChildren && isOpen) {
      html += `<div class="subtree">${buildTree(n.children, depth+1)}</div>`;
    }
  });
  return html;
}

function refreshTree() {
  document.getElementById('tree').innerHTML = buildTree(TREE);
  document.querySelectorAll('.tree-item').forEach(el => {
    el.addEventListener('click', () => {
      const id = el.dataset.id;
      const file = el.dataset.file;
      if (file) {
        activeFile = file;
        showFile(file);
      } else {
        if (openNodes.has(id)) openNodes.delete(id);
        else openNodes.add(id);
      }
      refreshTree();
    });
  });
}

function showFile(fileKey) {
  const f = FILES[fileKey];
  if (!f) return;
  const bc = f.breadcrumb || ['Lore', fileKey];
  document.getElementById('breadcrumb').innerHTML = bc.map((p,i) =>
    i < bc.length-1
      ? `<span style="opacity:0.5">${p}</span><span class="sep"> / </span>`
      : `<span>${p}</span>`
  ).join('');
  let code = '';
  if (f.type === 'json') code = renderJSON(f.content);
  else code = renderMD(f.content);
  document.getElementById('content-body').innerHTML =
    `<div class="code-block">${code}</div>`;
}

refreshTree();

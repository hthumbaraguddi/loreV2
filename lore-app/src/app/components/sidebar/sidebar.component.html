<!-- Toggle sidebar button (outside sidebar, fixed position) -->
<button class="btn-tsb" [class.closed]="state?.sidebarCollapsed" (click)="onToggleSidebar()" title="Toggle sidebar">
  <lore-icon [name]="state?.sidebarCollapsed ? 'chevron-right' : 'chevron-left'" [size]="10"></lore-icon>
</button>

<!-- Sidebar -->
<div id="sidebar" [class.collapsed]="state?.sidebarCollapsed">

  <!-- Workspace header -->
  <div class="ws-hdr">
    <div class="ws-av">{{ userInitial }}</div>
    <span class="ws-nm">My Workspace</span>
  </div>

  <!-- Quick actions -->
  <div class="sb-acts">
    <button class="sb-act" (click)="onOpenTemplates()">
      <span class="sai">📋</span><span>Templates</span>
    </button>
    <button class="sb-act" (click)="onOpenTemplateBuilder()">
      <span class="sai">🧩</span><span>Build Template</span>
    </button>
    <button class="sb-act" (click)="onOpenImportTemplate()">
      <span class="sai">📥</span><span>Import Template</span>
    </button>
  </div>

  <div class="sb-div"></div>

  <!-- Shelf / Notebook scroll area -->
  <div class="sb-scroll">

    <!-- Add shelf button -->
    <div class="shelf-hdr" (click)="onAddShelf()" style="margin-bottom:4px">
      <span class="sh-nm" style="text-transform:none;letter-spacing:0;font-size:12px;opacity:.6">＋ Add Shelf</span>
    </div>

    <!-- Shelves -->
    <div class="shelf-grp" *ngFor="let shelf of state?.shelves">
      <div class="shelf-hdr" (click)="onToggleShelf(shelf, $event)">
        <span class="sh-caret" [class.open]="shelf.open">▶</span>
        <span class="sh-ico">{{ shelf.icon }}</span>
        <span class="sh-nm">{{ shelf.name }}</span>
        <button class="sh-add" title="Add notebook" (click)="onAddNotebook(shelf, $event)">＋</button>
        <button class="sh-add" title="Edit shelf" (click)="onEditShelf(shelf, $event)" style="font-size:11px">✎</button>
      </div>

      <!-- Notebooks -->
      <div class="sh-books" [class.closed]="!shelf.open">
        <div
          class="nb-itm"
          *ngFor="let nb of getNotebooksForShelf(shelf.id)"
          [class.active]="isActiveNotebook(nb.id)"
          (click)="onSelectNotebook(nb)"
        >
          <span class="nb-itm-ico">{{ nb.icon }}</span>
          <span class="nb-itm-nm">{{ nb.name }}</span>
          <span class="nb-itm-ct">{{ nb.sections.length }}</span>
          <span class="nb-itm-ed">
            <button class="btn-nbe" title="Edit notebook" (click)="onEditNotebook(nb, $event)">✎</button>
          </span>
        </div>
      </div>
    </div>

  </div>

  <!-- Footer -->
  <div class="sb-foot">
    <div class="usr-pill" (click)="onOpenSettings()">
      <div class="usr-av">{{ userInitial }}</div>
      <div class="usr-info">
        <div class="usr-nm">{{ displayName || 'User' }}</div>
        <div class="usr-role">Free plan</div>
      </div>
      <button class="btn-cog" title="Settings">⚙</button>
    </div>
  </div>

</div>

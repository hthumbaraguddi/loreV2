<div class="pg-editor">

  <!-- Top bar -->
  <div class="pg-editor-topbar">
    <button class="pg-back-btn" (click)="onClose()">
      <lore-icon name="arrow-left" [size]="14"></lore-icon>
      Back
    </button>
    <div class="pg-editor-topbar-right">
      <span class="pg-dirty-dot" *ngIf="isDirty" title="Unsaved changes"></span>
      <button class="btn-gh" (click)="onDelete()">
        <lore-icon name="trash" [size]="12"></lore-icon> Delete
      </button>
      <button class="btn-pr" (click)="onSave()">
        <lore-icon name="save" [size]="13"></lore-icon> Save
      </button>
    </div>
  </div>

  <!-- Page content -->
  <div class="pg-editor-scroll">
    <div class="pg-editor-body">

      <!-- Icon + Title -->
      <div class="pg-editor-header">
        <input
          class="pg-icon-field"
          [(ngModel)]="icon"
          maxlength="4"
          (ngModelChange)="isDirty = true"
          title="Page icon (emoji)"
        >
        <textarea
          class="pg-title-field"
          [(ngModel)]="title"
          placeholder="Untitled"
          rows="1"
          (input)="onTitleInput($event)"
          (keydown.enter)="$event.preventDefault(); addBlock('text', -1)"
        ></textarea>
      </div>

      <!-- Blocks -->
      <div class="pg-editor-blocks">
        <div
          *ngFor="let block of blocks; let i = index; trackBy: trackByIndex"
          class="pg-editor-block"
          [class]="'pg-editor-block--' + block.type"
        >
          <!-- Left handle (shows block type label on hover, click opens slash menu) -->
          <div class="pg-block-handle" *ngIf="block.type !== 'divider'" (click)="showSlashMenu(i)" title="Change block type or type /">
            <span class="pg-handle-dot">⋮⋮</span>
            <span class="pg-handle-label">{{ block.type === 'heading' ? 'H1' : block.type === 'heading2' ? 'H2' : block.type === 'callout' ? '💡' : block.type === 'todo' ? '☐' : block.type === 'quote' ? '"' : '¶' }}</span>
          </div>

          <!-- Divider block -->
          <ng-container *ngIf="block.type === 'divider'">
            <div class="pg-editor-divider-line"></div>
            <button class="pg-block-remove" (click)="removeBlock(i)" title="Remove">✕</button>
          </ng-container>

          <!-- Todo block -->
          <ng-container *ngIf="block.type === 'todo'">
            <input
              type="checkbox"
              class="pg-todo-cb"
              [(ngModel)]="block.checked"
              (ngModelChange)="isDirty = true"
            >
            <textarea
              class="pg-editor-block-ta"
              [class.pg-todo-done-ta]="block.checked"
              [(ngModel)]="block.content"
              placeholder="To-do item…"
              rows="1"
              (keydown)="onBlockKeydown($event, i)"
              (input)="onTextareaInput($event, i)"
            ></textarea>
          </ng-container>

          <!-- All other blocks -->
          <ng-container *ngIf="block.type !== 'divider' && block.type !== 'todo'">
            <textarea
              class="pg-editor-block-ta"
              [(ngModel)]="block.content"
              [placeholder]="block.type === 'heading' ? 'Heading 1…' : block.type === 'heading2' ? 'Heading 2…' : block.type === 'callout' ? 'Callout…' : block.type === 'quote' ? 'Quote…' : 'Write something… (/ for commands, Shift+Enter for line break)'"
              rows="1"
              (keydown)="onBlockKeydown($event, i)"
              (input)="onTextareaInput($event, i)"
              (focus)="hideSlashMenu()"
            ></textarea>

            <!-- Slash command menu -->
            <div class="pg-slash-menu" *ngIf="slashMenuIndex === i">
              <div class="pg-slash-item" *ngFor="let bt of blockTypes" (mousedown)="selectSlashType(bt.type, i)">
                <span class="pg-slash-ico">{{ bt.icon }}</span>
                <span>{{ bt.label }}</span>
              </div>
            </div>
          </ng-container>
        </div>

        <!-- Add block hint -->
        <div class="pg-add-hint" (click)="addBlock('text')">
          <span class="pg-add-hint-plus">+</span>
          <span>Click to add a block, or press Enter at end of any block</span>
        </div>
      </div>

      <!-- Tags -->
      <div class="pg-editor-tags">
        <span class="pg-tag" *ngFor="let tag of tags; let i = index">
          {{ tag }}
          <button class="pg-tag-rm" (click)="removeTag(i)">✕</button>
        </span>
        <input
          class="pg-tag-input"
          [(ngModel)]="tagInput"
          placeholder="Add tag…"
          (keydown)="onTagKeydown($event)"
        >
      </div>

    </div>
  </div>

</div>
